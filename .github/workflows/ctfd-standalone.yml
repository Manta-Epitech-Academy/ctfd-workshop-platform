# Builds the `ctfd-standalone` image: CTFd with this branch's workshop plugin,
# the way in that needs no Jump (PLAN.md §58 to §61, issue #70).
#
# It is a test image, and its name says so. Production runs
# `ghcr.io/manta-epitech-academy/ctfd-custom`, which is built by the
# ctfd-custom repository from a pinned submodule and restarts the cluster when
# it is published. This workflow touches neither: it reads ctfd-custom, never
# writes to it, pushes under another name, and no deployment pulls that name.
#
# The Dockerfile is ctfd-custom's own, at a pinned commit, so the image differs
# from production's by the plugin and `tools/` of this branch and by nothing
# else. Bump CTFD_CUSTOM_REF by hand when the base has to move.
name: ctfd-standalone image

on:
  push:
    branches:
      - feat/standalone-token-door
    paths:
      - "plugins/**"
      - "tools/**"
      - ".github/workflows/ctfd-standalone.yml"
  workflow_dispatch:

concurrency:
  group: ctfd-standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/manta-epitech-academy/ctfd-standalone
  CTFD_CUSTOM_REPO: Manta-Epitech-Academy/ctfd-custom
  # ctfd-custom `master` on 2026-11-10.
  CTFD_CUSTOM_REF: b00bbea60bd0ff62ab543cbedb3a320ae3f7861e

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The base first, without its submodule: the directory the submodule
      # would fill is where this branch is checked out next.
      - name: Checkout ctfd-custom (read only)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CTFD_CUSTOM_REPO }}
          ref: ${{ env.CTFD_CUSTOM_REF }}
          submodules: false
          persist-credentials: false

      - name: Checkout this branch as workshop_platform/
        uses: actions/checkout@v5
        with:
          path: workshop_platform
          persist-credentials: false

      - name: Name the tags
        id: tags
        run: |
          slug=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          {
            echo "branch=${IMAGE}:${slug}"
            echo "sha=${IMAGE}:sha-${GITHUB_SHA::7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only, like ctfd-custom: tools/build_vendor.sh pins a PyYAML
      # wheel to manylinux2014_x86_64.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: ctfd-standalone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image without the token door is not this image. Checked on the
      # built filesystem, before anything is published under the name.
      - name: Check the image holds the token door
        run: |
          docker run --rm --entrypoint sh ctfd-standalone:ci -c '
            set -e
            cd /opt/CTFd/CTFd/plugins/workshop
            for f in tokendoor.py codes.py doors.py assets/door.js assets/pdf.js \
                     assets/pdf-brand.json assets/vendor/qrcode.js \
                     templates/workshop_token_door.html \
                     translations/fr/LC_MESSAGES/messages.mo; do
              test -s "$f" || { echo "missing: $f"; exit 1; }
            done
            ! grep -rqs "def jump_is_the_way_in" . || { echo "the Jump redirect is still here"; exit 1; }
            python -m compileall -q . >/dev/null
            echo "token door present, Jump redirect absent"
          '

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.tags.outputs.branch }}
            ${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.title=ctfd-standalone
            org.opencontainers.image.description=CTFd with the workshop plugin and its token door: registration codes, no Jump, no name and no e-mail. Test image, not what production runs.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.base.name=${{ env.CTFD_CUSTOM_REPO }}@${{ env.CTFD_CUSTOM_REF }}
            eu.epitech.manta.variant=standalone
          cache-from: type=gha

      - name: Say what was published
        run: |
          {
            echo "### ctfd-standalone"
            echo ""
            echo "- \`${{ steps.tags.outputs.branch }}\`"
            echo "- \`${{ steps.tags.outputs.sha }}\`"
            echo "- base: \`${CTFD_CUSTOM_REPO}@${CTFD_CUSTOM_REF::7}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
