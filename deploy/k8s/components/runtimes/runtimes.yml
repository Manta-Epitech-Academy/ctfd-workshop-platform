# One nginx that serves /runtime/<id>/<version>/ from the runtimes bucket for
# the instance (docs/DEPLOY.md, "Runtimes in the bucket"). It replaces the
# four per-runtime images and Services this component used to carry: the
# dists live in the bucket now, filled by each *_runtime repository's CI, and
# every runtime and every version is one object prefix away rather than one
# Deployment to pin. The config is deploy/nginx/runtimes-bucket.conf.tmpl
# with the two placeholders filled by the overlay (see ../../overlay-example).
# Resource figures follow the instance's own (ctfd-deploy.yml): small
# requests so idle instances pack, a limit that lets the active one burst.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rt-proxy
data:
  # Set by the overlay: the anonymous-read base of the bucket, ending in
  # /runtimes/, and the Host header that bucket answers to.
  RUNTIMES_URL: "https://storage.invalid/prefix-runtimes/runtimes/"
  RUNTIMES_HOST: "storage.invalid"
  nginx.conf.tmpl: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    proxy_cache_path /var/cache/nginx/runtimes levels=1:2 keys_zone=runtimes:10m
                     max_size=2g inactive=30d use_temp_path=off;
    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /runtime/ {
            rewrite ^(/runtime/.*)/$ $1/index.html last;
            proxy_pass @@RUNTIMES_URL@@;
            proxy_set_header Host @@RUNTIMES_HOST@@;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_cache runtimes;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header Strict-Transport-Security;
            proxy_intercept_errors on;
            error_page 404 = @runtime_latest;
            access_log off;
        }
        location @runtime_latest {
            if ($uri ~ "^/runtime/([^/]+)/(?!latest/)[^/]+/(.*)$") {
                return 302 /runtime/$1/latest/$2;
            }
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rt-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rt-proxy
  template:
    metadata:
      labels:
        app: rt-proxy
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          # The two placeholders are filled at start from the ConfigMap's
          # values, so the overlay patches two strings and no nginx syntax.
          command: ["/bin/sh", "-c"]
          args:
            - sed -e "s#@@RUNTIMES_URL@@#$RUNTIMES_URL#g" -e "s#@@RUNTIMES_HOST@@#$RUNTIMES_HOST#g"
              /config/nginx.conf.tmpl > /etc/nginx/conf.d/default.conf
              && exec nginx -g "daemon off;"
          envFrom:
            - configMapRef:
                name: rt-proxy
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "32Mi"
              cpu: "10m"
      volumes:
        - name: config
          configMap:
            name: rt-proxy
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rt-proxy
spec:
  selector:
    app: rt-proxy
  ports:
    - port: 80
      targetPort: 80
