# Shared by every workshop vhost. Install once:
#   sudo cp deploy/nginx/workshop-shared.conf /etc/nginx/conf.d/
#
# Only defines the WebSocket upgrade map. Setting `Connection: upgrade`
# unconditionally, as is often copied around, sends it on ordinary requests
# too; this sends "close" unless the client actually asked to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
