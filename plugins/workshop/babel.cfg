# Message extraction for the workshop plugin's own catalogue.
#
#   pybabel extract -F plugins/workshop/babel.cfg -k _l -k lazy_gettext \
#                   --no-location --sort-output \
#                   -o plugins/workshop/translations/messages.pot plugins/workshop
#
# -k _l matters: page.py builds NOTES and CARD_TEXT at import time and marks them
# with lazy_gettext aliased to _l, which is not one of pybabel's default
# keywords. Without it those thirteen strings extract as nothing and silently
# stay English.
#   pybabel update  -i plugins/workshop/translations/messages.pot \
#                   -d plugins/workshop/translations -l fr --no-fuzzy-matching
#   pybabel compile -f -d plugins/workshop/translations
#
# Four flags the first version of this comment left out, each of which changes
# what lands in git or whether anything lands at all:
#   --no-location        keeps file:line comments out of the catalogue, so moving
#                        a string within a template is not a diff in two more
#                        files. The committed catalogues have none.
#   --sort-output        alphabetical, so a new string lands beside its
#                        neighbours instead of at the end of the file.
#   --no-fuzzy-matching  a guessed translation nobody read is worse than an empty
#                        one: an empty msgstr falls through to CTFd's own
#                        catalogue or to the English source, a wrong one does not.
#   -f                   pybabel's own init header carries `#, fuzzy`, and without
#                        this compile skips the entire catalogue and writes no .mo
#                        at all, saying so on one line it is easy to miss.
#
# CTFd's own catalogue (CTFd/CTFd/translations) is separate and stays upstream's.
# flask-babel merges every directory in BABEL_TRANSLATION_DIRECTORIES, so this
# one supplements it rather than shadowing it — see plugins/workshop/__init__.py.
[python: **.py]
[jinja2: **/templates/**.html]
