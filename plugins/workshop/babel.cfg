# Message extraction for the workshop plugin's own catalogue.
#
#   pybabel extract -F plugins/workshop/babel.cfg -k _l -k lazy_gettext \
#                   -o plugins/workshop/translations/messages.pot plugins/workshop
#
# -k _l matters: page.py builds NOTES and CARD_TEXT at import time and marks them
# with lazy_gettext aliased to _l, which is not one of pybabel'''s default
# keywords. Without it those thirteen strings extract as nothing and silently
# stay English.
#   pybabel update  -i plugins/workshop/translations/messages.pot -d plugins/workshop/translations -l fr
#   pybabel compile -d plugins/workshop/translations
#
# CTFd's own catalogue (CTFd/CTFd/translations) is separate and stays upstream's.
# flask-babel merges every directory in BABEL_TRANSLATION_DIRECTORIES, so this
# one supplements it rather than shadowing it — see plugins/workshop/__init__.py.
[python: **.py]
[jinja2: **/templates/**.html]
