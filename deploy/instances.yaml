# The five production instances (PLAN.md §22).
#
# This first deploy is a demonstration that the platform is generic, not a
# workshop session: one instance per subject, each showing something the others
# do not. Nothing secret lives here — passwords, session keys and registration
# codes are generated into deploy/secrets.yaml, which is gitignored.
#
#   python3 tools/provision.py render          # env files + nginx vhosts
#   python3 tools/provision.py up <name>       # start the stack
#   python3 tools/provision.py setup <name>    # wizard + instance settings
#   python3 tools/provision.py sync <name>     # runtimes + content
#
# `ctf_name` and `ctf_description` are NOT set here: they are read from the
# subject's own `project.name` / `project.summary` (or a workshop manifest's
# `workshop.name` / `workshop.summary`), so the instance is titled by its
# content rather than by a second copy of it that can drift.

# The DNS suffix every instance sits under. Each instance is
# <name>.<domain> — one A record per instance, CTFd at the root of it, no
# APPLICATION_ROOT and no path rewriting.
#
# DuckDNS resolves this name as a wildcard: every sub-subdomain of it answers
# with the same address, verified 2026-08-18 — no per-instance record to add.
# The flip side is that a name nobody configured still reaches the server, so
# deploy/nginx/default-server.conf refuses anything that is not a real vhost.
domain: ealab.duckdns.org

# Applied to every instance at setup, overridable per instance below.
defaults:
  user_mode: users          # individuals, not teams
  scoreboard: true          # kept: it helps this audience more than it hurts
  mode: instructor_led      # instructor_led | self_serve — PLAN.md §25
  verify_emails: false      # no mail server, and no addresses to verify
  locale: fr                # the audience is French lycéens; a participant can
                            # still change it per account in /settings

  # The Jump environments allowed to send talents here (PLAN.md §31). One entry
  # per environment, because one instance serving both the dev Jump and the
  # production one is exactly what a demo needs and costs nothing to allow.
  #
  # The key id is what a ticket carries, and the `origin` below — never the
  # ticket — is where this instance reports progress back to, so nobody can
  # redirect its callbacks. The `label` namespaces the accounts that
  # environment creates: it is what keeps a dev talent out of a production
  # scoreboard, so it must differ between entries and must not be renamed once
  # accounts exist.
  #
  # **No secrets here.** provision.py mints one shared secret per key id into
  # deploy/secrets.yaml (gitignored) and prints it; paste it into that Jump
  # environment's WORKSHOP_TICKET_SECRET. If Jump already has one, put it in
  # secrets.yaml under `jump_secrets:` first and provision.py will keep it.
  jump:
    jump-prod:
      origin: https://epiboost.fr
      label: prod
    jump-dev:
      origin: https://epiboost.eu
      label: dev

# `source` is the repository an instance imports from when somebody presses Sync
# on /admin/workshop/sync (PLAN.md §26). `content:` stays what the command line
# imports from this checkout; the two are the same content, and the page records
# which commit it took so drift is visible. Add `source_ref:` to follow a tag or
# a branch other than `main`.
#
# `registration` is derived from the mode and is not set here: an instructor-led
# instance gets the shared code (it is a session, not a public site), a
# self-serve one is open. Set `registration: code|open` on an instance to
# override that for a case neither shape fits.

# Ports are loopback-only and deliberately in the 908x range, clear of the
# 808x dev instances in compose/*.env: a production stack and a development
# one on the same machine would otherwise silently answer for each other.
instances:
  # The baseline: one subject, the TIC-80 editor beside the instructions.
  - name: pypong
    port: 9080
    content: content/pypong
    source: kevin-cazal/pypong_subject

  # A subject that brings its own runtime instead of reusing TIC-80.
  - name: pacman
    port: 9081
    content: content/pacman
    source: kevin-cazal/pacman-ghost-ai_subject

  # The real workshop: four parts, optional bonuses, a free-choice chapter.
  - name: santa
    port: 9082
    content: content/santa_shooter
    source: kevin-cazal/santa_shooter_subject

  # Multi-subject composition: Shell RPG gates Shell 1, both on one v86 dist.
  - name: discover-linux
    port: 9083
    content: content/workshops/discover-linux
    source: kevin-cazal/discover-linux_subjects
    workshop: true

  # A runtime that grades itself: validation by token, and a prerequisite DAG.
  - name: miniasm
    port: 9084
    content: content/miniasm
    source: kevin-cazal/miniasm_subject

  # Three subjects in a strict chain, no runtime, and deliberately no self.*
  # twin (PLAN.md §28.4): faire connaissance, then the dataset an LLM produces,
  # then the code that reads it.
  - name: back2epitech
    port: 9090
    content: content/workshops/back2epitech
    source: kevin-cazal/back2epitech_subjects
    workshop: true

  # ---------------------------------------------------------------------
  # The same five workshops in self-serve mode (PLAN.md §25.9): validated by
  # a button instead of an instructor code, open registration, no session.
  # One instance, one mode, so a second mode is a second instance — the five
  # above keep their codes and their cohorts.
  # ---------------------------------------------------------------------
  - name: self-pypong
    host: self.pypong.ealab.duckdns.org
    port: 9085
    content: content/pypong
    source: kevin-cazal/pypong_subject
    mode: self_serve

  - name: self-pacman
    host: self.pacman.ealab.duckdns.org
    port: 9086
    content: content/pacman
    source: kevin-cazal/pacman-ghost-ai_subject
    mode: self_serve

  - name: self-santa
    host: self.santa.ealab.duckdns.org
    port: 9087
    content: content/santa_shooter
    source: kevin-cazal/santa_shooter_subject
    mode: self_serve

  - name: self-discover-linux
    host: self.discover-linux.ealab.duckdns.org
    port: 9088
    content: content/workshops/discover-linux
    source: kevin-cazal/discover-linux_subjects
    workshop: true
    mode: self_serve

  - name: self-miniasm
    host: self.miniasm.ealab.duckdns.org
    port: 9089
    content: content/miniasm
    source: kevin-cazal/miniasm_subject
    mode: self_serve
