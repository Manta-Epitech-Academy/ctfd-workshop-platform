# Refuse hostnames that are not one of ours. Install once:
#   sudo cp deploy/nginx/default-server.conf /etc/nginx/conf.d/
#
# ealab.duckdns.org is a *wildcard*: anything.ealab.duckdns.org resolves to the
# server, whether we configured it or not. Without a default server, nginx
# hands those requests to whichever vhost loads first — so one instance would
# quietly answer for every unclaimed name, and its cookies would be set on
# hostnames we do not control.
#
# **Check for an existing default first**: nginx refuses to start with two.
#   grep -rn default_server /etc/nginx/ | grep -v workshop
server {
    listen 80  default_server;
    listen [::]:80 default_server;
    server_name _;
    # 444: close without a response. Nothing here is a real service, and an
    # error page would only confirm the host exists.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuse the TLS handshake outright rather than presenting some other
    # instance's certificate. nginx >= 1.19.4; on older, point this at any
    # certificate instead and `return 444;`.
    ssl_reject_handshake on;
}
