# Shared by every workshop vhost. Install once:
#   sudo cp deploy/nginx/workshop-shared.conf /etc/nginx/conf.d/
#
# Only defines the WebSocket upgrade map. Setting `Connection: upgrade`
# unconditionally, as is often copied around, sends it on ordinary requests
# too; this sends "close" unless the client actually asked to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The on-disk cache of the runtime dists fetched from the bucket
# (runtimes-bucket.conf.tmpl). http context, hence here. 2 GB holds every
# version of every runtime many times over; an object nobody asked for in
# 30 days goes. Harmless when the vhosts serve the dists from disk instead.
proxy_cache_path /var/cache/nginx/runtimes levels=1:2 keys_zone=runtimes:10m
                 max_size=2g inactive=30d use_temp_path=off;
