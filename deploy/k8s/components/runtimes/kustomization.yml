# The runtimes, for a CTFd instance on Kubernetes (docs/DEPLOY.md, "Runtimes
# in the bucket"). A kustomize Component: an instance overlay lists it under
# `components:` and gets one nginx that serves /runtime/<id>/<version>/ from
# the runtimes bucket, a second Ingress on the instance's host that routes
# /runtime to it, and the CTFd variable that makes the plugin trust the
# declaration instead of looking for the dist on its own disk.
#
# The overlay sets three things (see ../../overlay-example):
#
#   - the host of `ctfd-runtimes-ingress` (one JSON patch line)
#   - RUNTIMES_URL and RUNTIMES_HOST in the `rt-proxy` ConfigMap
#
# No image to pin any more: a subject pins a version in its subject.yaml,
# and the bucket holds every version the CIs ever uploaded.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - runtimes.yml
  - ingress.yml
patches:
  # plugins/workshop/runtime.py: the dists are not on CTFd's disk here.
  - target:
      kind: Deployment
      name: ctfd
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WORKSHOP_RUNTIMES_ON_PROXY
          value: "1"
